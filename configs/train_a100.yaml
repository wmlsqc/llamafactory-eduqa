# LLaMA-Factory v0.9.3; single rentable NVIDIA A100 40/80 GB.
# Same QLoRA method and effective batch as the 4090 profile; increased microbatch.
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: false
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
upcast_layernorm: true
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
dataset_dir: artifacts/data
dataset: eduqa_train
eval_dataset: eduqa_val
template: qwen
cutoff_len: 2048
preprocessing_num_workers: 8
dataloader_num_workers: 4
packing: false
train_on_prompt: false
output_dir: artifacts/models/eduqa-adapter
overwrite_output_dir: false
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 0.0001
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
fp16: false
optim: adamw_torch
seed: 42
data_seed: 42
ddp_timeout: 1800
