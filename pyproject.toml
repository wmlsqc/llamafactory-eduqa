[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llamafactory-eduqa"
version = "0.2.0"
description = "Reproducible education QA: QLoRA training, evaluation and vLLM serving"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML==6.0.2",
  "httpx==0.28.1",
  "fastapi==0.115.12",
  "pydantic==2.10.6",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
download = ["huggingface-hub==0.31.4"]

[project.scripts]
eduqa = "eduqa.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eduqa = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
